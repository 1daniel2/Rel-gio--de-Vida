
cat > app/src/main/java/com/vida/relogio/MainActivity.java <<'EOF'
package com.vida.relogio;

import android.app.Activity;
import android.os.Bundle;
import android.graphics.Color;
import android.view.Gravity;
import android.widget.TextView;
import java.util.Calendar;

public class MainActivity extends Activity {
    public void onCreate(Bundle b) {
        super.onCreate(b);

        TextView t = new TextView(this);
        t.setTextColor(Color.WHITE);
        t.setTextSize(24);
        t.setGravity(Gravity.CENTER);
        t.setBackgroundColor(Color.rgb(8,13,18));

        Calendar n = Calendar.getInstance();
        n.set(1991, Calendar.AUGUST, 1);

        Calendar h = Calendar.getInstance();
        int idade = h.get(Calendar.YEAR) - 1991;
        if (h.get(Calendar.MONTH) < 7 ||
            (h.get(Calendar.MONTH) == 7 && h.get(Calendar.DAY_OF_MONTH) < 1))
            idade--;

        t.setText("RELÓGIO DE VIDA\n\nNascimento: 01/08/1991\n\nIdade: " + idade + " anos");
        setContentView(t);
    }
}
EOF
