
name: Criar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Criar projeto
        run: |
          mkdir -p app/src/main/java/com/vida/relogio
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable

          cat > settings.gradle <<'EOF'
          pluginManagement {
            repositories {
              google()
              mavenCentral()
              gradlePluginPortal()
            }
          }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
              google()
              mavenCentral()
            }
          }
          rootProject.name='RelogioVida'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
            id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
            id 'com.android.application'
          }

          android {
            namespace 'com.vida.relogio'
            compileSdk 35

            defaultConfig {
              applicationId 'com.vida.relogio'
              minSdk 23
              targetSdk 35
              versionCode 4
              versionName '4.0'
            }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application
              android:theme="@style/AppTheme"
              android:label="Relógio de Vida">

              <activity
                android:name=".MainActivity"
                android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>

              <receiver
                android:name=".VidaWidget"
                android:exported="true">
                <intent-filter>
                  <action android:name="android.appwidget.action.APPWIDGET_UPDATE"/>
                </intent-filter>
                <meta-data
                  android:name="android.appwidget.provider"
                  android:resource="@xml/widget_info"/>
              </receiver>

            </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
            <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
              <item name="android:fontFamily">sans</item>
              <item name="android:statusBarColor">#05070A</item>
              <item name="android:navigationBarColor">#05070A</item>
            </style>
          </resources>
          EOF

          cat > app/src/main/res/drawable/widget_bg.xml <<'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
            <solid android:color="#101820"/>
            <corners android:radius="22dp"/>
            <stroke
              android:width="1dp"
              android:color="#304550"/>
          </shape>
          EOF

          cat > app/src/main/res/layout/widget.xml <<'EOF'
          <LinearLayout
            xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:orientation="vertical"
            android:gravity="center"
            android:padding="12dp"
            android:background="@drawable/widget_bg">

            <TextView
              android:id="@+id/titulo"
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:text="RELÓGIO DE VIDA"
              android:textColor="#8FAAB5"
              android:textSize="11sp"
              android:textStyle="bold"
              android:gravity="center"/>

            <TextView
              android:id="@+id/idade"
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:text="CONFIGURE A DATA"
              android:textColor="#FFFFFF"
              android:textSize="24sp"
              android:textStyle="bold"
              android:gravity="center"/>

            <TextView
              android:id="@+id/dias"
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:text="Abra o aplicativo"
              android:textColor="#42D3E8"
              android:textSize="13sp"
              android:gravity="center"/>

            <TextView
              android:id="@+id/segundos"
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:text="para começar"
              android:textColor="#B8C7CC"
              android:textSize="11sp"
              android:gravity="center"/>

          </LinearLayout>
          EOF

          cat > app/src/main/res/xml/widget_info.xml <<'EOF'
          <appwidget-provider
            xmlns:android="http://schemas.android.com/apk/res/android"
            android:minWidth="250dp"
            android:minHeight="100dp"
            android:updatePeriodMillis="60000"
            android:initialLayout="@layout/widget"/>
          EOF

          cat > app/src/main/java/com/vida/relogio/MainActivity.java <<'EOF'
          package com.vida.relogio;

          import android.app.*;
          import android.os.*;
          import android.graphics.Color;
          import android.view.Gravity;
          import android.widget.*;
          import android.content.*;
          import java.util.Calendar;

          public class MainActivity extends Activity {

            LinearLayout tela;
            TextView info;
            long nascimento;

            public void onCreate(Bundle b) {
              super.onCreate(b);

              nascimento = getSharedPreferences("vida",0)
                  .getLong("nascimento",0);

              if(nascimento == 0) configurar();
              else mostrar();
            }

            void configurar() {

              tela = new LinearLayout(this);
              tela.setOrientation(LinearLayout.VERTICAL);
              tela.setGravity(Gravity.CENTER);
              tela.setPadding(30,30,30,30);
              tela.setBackgroundColor(Color.rgb(5,7,10));

              TextView titulo = new TextView(this);
              titulo.setText("◈  RELÓGIO DE VIDA  ◈");
              titulo.setTextColor(Color.WHITE);
              titulo.setTextSize(28);
              titulo.setGravity(Gravity.CENTER);

              TextView texto = new TextView(this);
              texto.setText("\nQual é sua data de nascimento?\n");
              texto.setTextColor(Color.LTGRAY);
              texto.setTextSize(18);
              texto.setGravity(Gravity.CENTER);

              Button botao = new Button(this);
              botao.setText("ESCOLHER DATA");

              tela.addView(titulo);
              tela.addView(texto);
              tela.addView(botao);
              setContentView(tela);

              botao.setOnClickListener(v -> escolher());
            }

            void escolher() {

              Calendar c = Calendar.getInstance();

              DatePickerDialog d = new DatePickerDialog(
                this,
                (view, ano, mes, dia) -> {

                  Calendar data = Calendar.getInstance();
                  data.set(ano,mes,dia,0,0,0);
                  data.set(Calendar.MILLISECOND,0);

                  nascimento = data.getTimeInMillis();

                  getSharedPreferences("vida",0)
                    .edit()
                    .putLong("nascimento",nascimento)
                    .apply();

                  mostrar();

                  Intent i = new Intent(
                    "android.appwidget.action.APPWIDGET_UPDATE");
                  sendBroadcast(i);
                },
                c.get(Calendar.YEAR)-30,
                c.get(Calendar.MONTH),
                c.get(Calendar.DAY_OF_MONTH)
              );

              d.getDatePicker()
                .setMaxDate(System.currentTimeMillis());

              d.show();
            }

            void mostrar() {

              tela = new LinearLayout(this);
              tela.setOrientation(LinearLayout.VERTICAL);
              tela.setGravity(Gravity.CENTER);
              tela.setPadding(30,30,30,30);
              tela.setBackgroundColor(Color.rgb(5,7,10));

              TextView titulo = new TextView(this);
              titulo.setText("◈  RELÓGIO DE VIDA  ◈");
              titulo.setTextColor(Color.WHITE);
              titulo.setTextSize(26);
              titulo.setGravity(Gravity.CENTER);

              info = new TextView(this);
              info.setTextColor(Color.WHITE);
              info.setTextSize(20);
              info.setGravity(Gravity.CENTER);
              info.setPadding(0,35,0,0);

              Button alterar = new Button(this);
              alterar.setText("ALTERAR DATA");

              tela.addView(titulo);
              tela.addView(info);
              tela.addView(alterar);
              setContentView(tela);

              alterar.setOnClickListener(v -> escolher());

              atualizar();
            }

            void atualizar() {

              long seg =
                (System.currentTimeMillis()-nascimento)/1000;

              long anos = seg/31557600;
              long dias = (seg%31557600)/86400;
              long horas = (seg%86400)/3600;
              long min = (seg%3600)/60;
              long s = seg%60;

              info.setText(
                anos+" ANOS\n\n"+
                dias+" DIAS\n\n"+
                horas+" HORAS  "+
                min+" MIN  "+
                s+" SEG"
              );

              info.postDelayed(() -> atualizar(),1000);
            }
          }
          EOF

          cat > app/src/main/java/com/vida/relogio/VidaWidget.java <<'EOF'
          package com.vida.relogio;

          import android.appwidget.*;
          import android.content.*;
          import android.widget.RemoteViews;

          public class VidaWidget extends AppWidgetProvider {

            public void onUpdate(
                Context context,
                AppWidgetManager manager,
                int[] ids) {

              long nascimento =
                context.getSharedPreferences("vida",0)
                .getLong("nascimento",0);

              for(int id:ids) {

                RemoteViews v = new RemoteViews(
                  context.getPackageName(),
                  R.layout.widget);

                if(nascimento == 0) {

                  v.setTextViewText(
                    R.id.idade,"CONFIGURE A DATA");

                  v.setTextViewText(
                    R.id.dias,"Abra o aplicativo");

                  v.setTextViewText(
                    R.id.segundos,"para começar");

                } else {

                  long seg =
                    (System.currentTimeMillis()
                    - nascimento)/1000;

                  long anos = seg/31557600;
                  long dias = seg/86400;

                  v.setTextViewText(
                    R.id.idade,
                    anos+" ANOS");

                  v.setTextViewText(
                    R.id.dias,
                    dias+" DIAS VIVIDOS");

                  v.setTextViewText(
                    R.id.segundos,
                    seg+" SEGUNDOS");
                }

                manager.updateAppWidget(id,v);
              }
            }
          }
          EOF

          gradle wrapper --gradle-version 8.9
          ./gradlew assembleDebug

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: Relogio-de-Vida-v4
          path: app/build/outputs/apk/debug/app-debug.apk
