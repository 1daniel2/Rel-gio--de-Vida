
name: Criar APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Criar projeto
        run: |
          mkdir -p app/src/main/java/com/vida/relogio

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name='RelogioVida'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.vida.relogio'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.vida.relogio'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:theme="@android:style/Theme.Material.NoActionBar"
                  android:label="Relógio de Vida">
                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/vida/relogio/MainActivity.java <<'EOF'
          package com.vida.relogio;

          import android.app.*;
          import android.os.*;
          import android.content.*;
          import android.graphics.Color;
          import android.view.*;
          import android.widget.*;
          import java.util.*;

          public class MainActivity extends Activity {
              TextView info;
              Calendar nascimento = Calendar.getInstance();
              final long EXPECTATIVA = 80L * 365 * 24 * 60 * 60 * 1000;

              public void onCreate(Bundle b) {
                  super.onCreate(b);

                  LinearLayout l = new LinearLayout(this);
                  l.setOrientation(LinearLayout.VERTICAL);
                  l.setGravity(Gravity.CENTER);
                  l.setPadding(30,30,30,30);
                  l.setBackgroundColor(Color.rgb(8,13,18));

                  TextView titulo = new TextView(this);
                  titulo.setText("RELÓGIO DE VIDA");
                  titulo.setTextColor(Color.WHITE);
                  titulo.setTextSize(30);
                  titulo.setGravity(Gravity.CENTER);

                  Button data = new Button(this);
                  data.setText("Escolher data de nascimento");

                  info = new TextView(this);
                  info.setTextColor(Color.WHITE);
                  info.setTextSize(18);
                  info.setGravity(Gravity.CENTER);
                  info.setPadding(0,30,0,0);

                  l.addView(titulo);
                  l.addView(data);
                  l.addView(info);
                  setContentView(l);

                  long salvo = getPreferences(0).getLong("data",0);
                  if(salvo > 0) {
                      nascimento.setTimeInMillis(salvo);
                      atualizar();
                  }

                  data.setOnClickListener(v -> escolherData());
              }

              void escolherData() {
                  Calendar c = Calendar.getInstance();
                  DatePickerDialog d = new DatePickerDialog(this,
                      (view, y, m, day) -> {
                          nascimento.set(y,m,day,0,0,0);
                          getPreferences(0).edit()
                              .putLong("data",nascimento.getTimeInMillis()).apply();
                          atualizar();
                      },
                      nascimento.get(Calendar.YEAR)-30,
                      nascimento.get(Calendar.MONTH),
                      nascimento.get(Calendar.DAY_OF_MONTH));
                  d.getDatePicker().setMaxDate(System.currentTimeMillis());
                  d.show();
              }

              void atualizar() {
                  new Handler().postDelayed(new Runnable() {
                      public void run() {
                          long agora = System.currentTimeMillis();
                          long vivido = agora - nascimento.getTimeInMillis();
                          long restante = EXPECTATIVA - vivido;

                          if(restante < 0) restante = 0;

                          long seg = vivido / 1000;
                          long anos = seg / 31557600;
                          seg %= 31557600;
                          long dias = seg / 86400;
                          seg %= 86400;
                          long horas = seg / 3600;
                          seg %= 3600;
                          long min = seg / 60;
                          long segundos = seg % 60;

                          long r = restante / 1000;
                          long ra = r / 31557600;
                          r %= 31557600;
                          long rd = r / 86400;
                          r %= 86400;
                          long rh = r / 3600;
                          r %= 3600;
                          long rm = r / 60;
                          long rs = r % 60;

                          info.setText(
                              "Você já viveu aproximadamente:\n" +
                              anos+" anos, "+dias+" dias, "+horas+"h "+min+"min "+segundos+"s\n\n" +
                              "Até 80 anos, restam aproximadamente:\n" +
                              ra+" anos, "+rd+" dias, "+rh+"h "+rm+"min "+rs+"s"
                          );

                          new Handler().postDelayed(this,1000);
                      }
                  },0);
              }
          }
          EOF

          gradle wrapper --gradle-version 8.9
          ./gradlew assembleDebug

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: Relogio-de-Vida
          path: app/build/outputs/apk/debug/app-debug.apk
