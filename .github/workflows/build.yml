name: Criar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Criar projeto
        run: |
          mkdir -p app/src/main/java/com/vida/relogio

          cat > settings.gradle <<'EOF'
          pluginManagement {
            repositories {
              google()
              mavenCentral()
              gradlePluginPortal()
            }
          }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
              google()
              mavenCentral()
            }
          }
          rootProject.name='RelogioVida'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
            id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
            id 'com.android.application'
          }

          android {
            namespace 'com.vida.relogio'
            compileSdk 35

            defaultConfig {
              applicationId 'com.vida.relogio'
              minSdk 23
              targetSdk 35
              versionCode 1
              versionName '1.0'
            }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application
              android:theme="@style/AppTheme"
              android:label="Relógio de Vida">
              <activity
                android:name=".MainActivity"
                android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          mkdir -p app/src/main/res/values

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
            <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
              <item name="android:fontFamily">sans</item>
              <item name="android:windowLightStatusBar">false</item>
              <item name="android:statusBarColor">#080D12</item>
              <item name="android:navigationBarColor">#080D12</item>
            </style>
          </resources>
          EOF

          cat > app/src/main/java/com/vida/relogio/MainActivity.java <<'EOF'
          package com.vida.relogio;

          import android.app.Activity;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.view.Gravity;
          import android.widget.TextView;
          import java.util.Calendar;

          public class MainActivity extends Activity {
            TextView t;

            public void onCreate(Bundle b) {
              super.onCreate(b);
              t = new TextView(this);
              t.setTextColor(Color.WHITE);
              t.setTextSize(22);
              t.setGravity(Gravity.CENTER);
              t.setBackgroundColor(Color.rgb(8,13,18));
              setContentView(t);
              atualizar();
            }

            void atualizar() {
              Calendar nascimento = Calendar.getInstance();
              nascimento.set(1991, 7, 1, 0, 0, 0);

              long vida = System.currentTimeMillis()
                  - nascimento.getTimeInMillis();

              long seg = vida / 1000;
              long anos = seg / 31557600;
              long dias = (seg % 31557600) / 86400;
              long horas = (seg % 86400) / 3600;
              long min = (seg % 3600) / 60;
              long s = seg % 60;

              t.setText(
                "RELÓGIO DE VIDA\n\n" +
                "Nascimento: 01/08/1991\n\n" +
                anos + " anos\n" +
                dias + " dias\n" +
                horas + " horas\n" +
                min + " minutos\n" +
                s + " segundos"
              );

              t.postDelayed(() -> atualizar(), 1000);
            }
          }
          EOF

      - name: Compilar
        run: gradle assembleDebug

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: Relogio-de-Vida
          path: app/build/outputs/apk/debug/app-debug.apk
