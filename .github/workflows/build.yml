
name: Criar APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Criar projeto
        run: |
          mkdir -p app/src/main/java/com/vida/relogio

          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name='RelogioVida'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }

          android {
              namespace 'com.vida.relogio'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.vida.relogio'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:theme="@android:style/Theme.Material.NoActionBar"
                  android:label="Relógio de Vida">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/vida/relogio/MainActivity.java <<'EOF'
          package com.vida.relogio;

          import android.app.Activity;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.view.Gravity;
          import android.widget.TextView;

          public class MainActivity extends Activity {
              public void onCreate(Bundle b) {
                  super.onCreate(b);
                  TextView t = new TextView(this);
                  t.setText("RELÓGIO DE VIDA\n\nData de nascimento");
                  t.setTextColor(Color.WHITE);
                  t.setTextSize(24);
                  t.setGravity(Gravity.CENTER);
                  t.setBackgroundColor(Color.rgb(8,13,18));
                  setContentView(t);
              }
          }
          EOF

      - name: Compilar
        run: |
          gradle assembleDebug

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: Relogio-de-Vida
          path: app/build/outputs/apk/debug/app-debug.apk
